name: Deploy ApexShield site to GitHub Pages

# Publishes apexshield-roofing/ at the root of the Pages URL,
# so the site lives at https://arpan9058.github.io/tasks/

on:
  push:
    branches: [main]
    paths:
      - 'apexshield-roofing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on for the repository if it is not on yet,
        # so no manual visit to the settings page is needed
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: apexshield-roofing

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
